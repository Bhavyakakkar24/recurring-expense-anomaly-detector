<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ExpenseGuard - My Profile</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">
                Expense<span>Guard</span>
            </div>

            <div class="menu-title">
                MAIN MENU
            </div>

            <a href="../dashboard.html" class="nav-item">
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>

            <a href="transactions.html" class="nav-item">
                <span class="nav-icon">₹</span>
                Transactions
            </a>

            <a href="anomalies.html" class="nav-item">
                <span class="nav-icon">⚠</span>
                Anomalies
            </a>

            <a href="categories.html" class="nav-item">
                <span class="nav-icon">▣</span>
                Categories
            </a>

            <div class="menu-title">
                SETTINGS
            </div>

            <a href="settings.html" class="nav-item">
                <span class="nav-icon">⚙</span>
                Settings
            </a>

        </aside>


        <!-- MAIN -->

        <main class="main">

            <header class="header">

                <div>

                    <h1>
                        My Profile
                    </h1>

                    <p>
                        Manage your ExpenseGuard account.
                    </p>

                </div>

            </header>


            <section class="card">

                <div class="card-header">

                    <div>

                        <h2>
                            Account Information
                        </h2>

                        <p>
                            Your current account details.
                        </p>

                    </div>

                </div>


                <div style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:20px;
                    margin-top:20px;
                ">

                    <div>

                        <label style="
                            display:block;
                            font-weight:600;
                            margin-bottom:8px;
                        ">
                            Full Name
                        </label>

                        <div
                            id="profilePageName"
                            style="
                                padding:14px;
                                border:1px solid #e2e8f0;
                                border-radius:8px;
                            "
                        >
                            -
                        </div>

                    </div>


                    <div>

                        <label style="
                            display:block;
                            font-weight:600;
                            margin-bottom:8px;
                        ">
                            Email Address
                        </label>

                        <div
                            id="profilePageEmail"
                            style="
                                padding:14px;
                                border:1px solid #e2e8f0;
                                border-radius:8px;
                            "
                        >
                            -
                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="../javascript/app.js"></script>

    <script>

        const user =
            JSON.parse(
                localStorage.getItem(
                    "expenseGuardCurrentUser"
                )
            );

        if (user) {

            document.getElementById(
                "profilePageName"
            ).textContent = user.name;

            document.getElementById(
                "profilePageEmail"
            ).textContent = user.email;

        }

    </script>

</body>

</html>
